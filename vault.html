<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNERLOGUE - VAULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="assets/logo.svg" type="image/x-icon">
</head>
<body>
    <header>
        <nav class="navbar d-flex justify-content-between align-items-center px-4 py-3" aria-label="Header navigation bar">
            <a class="text-decoration-none fs-1 entry-title-link" href="index.html">INNERLOGUE</a>
            <ul class="nav-list liquid-glass d-flex align-items-center gap-4 px-4 py-2 list-unstyled">
                <li><a class="text-decoration-none entry-title-link" href="index.html">HOME</a></li>
                <li><a class="text-decoration-none entry-title-link" href="new-entry.html">NEW ENTRY</a></li>
                <li><a class="text-decoration-none liquid-glass px-3 py-1" href="vault.html">MY VAULT</a></li>
            </ul>
        </nav>
    </header>
    <main class="container d-flex flex-column justify-content-center align-items-center">
        <section class="text-center">
            <h1>MY VAULT</h1>
            <p>View and manage all your saved entries.</p>
        </section>

        <section class="vault-controls container d-flex flex-row justify-content-center gap-5 mb-5">
            <input type="search" id="search-entries" placeholder="Search entry titles" class="liquid-glass p-2">

            <label for="sort-entries" class="visually-hidden">Sort entries</label>
            <select id="sort-entries" class="liquid-glass">
                <option value="" selected disabled>Sort by</option>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="title">Title A-Z</option>
            </select>

            <p class="liquid-glass p-2"><span id="entry-count">0</span> entries</p>
        </section>

        <section class="all-entries liquid-glass px-5 py-4 mb-5">
            <h2 class="text-center mb-4">ALL ENTRIES</h2>

            <ul id="vault-entry-list" class="list-unstyled container d-flex flex-column justify-content-center align-items-center gap-3">
            </ul>
        </section>
    </main>
    <script type="module" src="js/vault.js"></script>
</body>
</html>
