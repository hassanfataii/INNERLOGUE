<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNERLOGUE - NEW ENTRY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <p id="form-message" class="save-message liquid-glass" hidden></p>
    <header>
        <nav class="navbar d-flex justify-content-between align-items-center px-4 py-3" aria-label="Header navigation bar">
            <a class="text-decoration-none fs-1 entry-title-link" href="index.html">INNERLOGUE</a>
            <ul class="nav-list liquid-glass d-flex align-items-center gap-4 px-4 py-2 list-unstyled">
                <li><a class="text-decoration-none entry-title-link" href="index.html">HOME</a></li>
                <li><a class="text-decoration-none liquid-glass px-3 py-1" href="new-entry.html">NEW ENTRY</a></li>
                <li><a class="text-decoration-none entry-title-link" href="vault.html">MY VAULT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="container d-flex flex-column justify-content-center align-items-center text-center mb-5">
            <h1>NEW ENTRY</h1>
            <p>Write down what is on your mind.</p>

            <form id="entry-form" class="liquid-glass p-5 container d-flex flex-column gap-4">
                <div class="d-flex flex-column gap-2">
                    <label for="entry-title">Title</label>
                    <input type="text" id="entry-title" name="entry-title" class="entry-input" required>
                </div>

                <div class="d-flex flex-column gap-2">
                    <label for="entry-body">Reflection</label>
                    <textarea id="entry-body" name="entry-body" rows="10" class="entry-input" required></textarea>
                </div>

                <button class="glass-button align-self-center" type="submit">SAVE ENTRY</button>
            </form>
        </section>
    </main>
    <script type="module" src="js/newEntry.js"></script>
</body>
</html>
