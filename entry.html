<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNERLOGUE - ENTRY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header class="container d-flex flex-column justify-content-center align-items-center mb-5 fs-1">
        <nav aria-label="Header navigation bar">
            <a class="text-decoration-none" href="index.html">INNERLOGUE</a>
        </nav>
    </header>
    <main class="container d-flex flex-column justify-content-center align-items-center p-5">
        <article id="entry-view" class="liquid-glass px-5 py-5">
            <header class="text-center">
                <h1 id="entry-title">ENTRY TITLE</h1>
                <p id="entry-date" class="fs-5">ENTRY DATE</p>
            </header>

            <div class="mb-5 text-center">
                <p id="entry-content">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Molestiae corporis repudiandae commodi odio ea at quod facere neque iusto ipsum tempore ducimus deleniti, quo quisquam voluptate. Non provident fuga fugiat.</p>
            </div>
            <footer class="text-center ">
                <a class="liquid-glass px-1 py-1 text-decoration-none" href="vault.html">BACK TO VAULT</a>
                <button id="edit-entry" class="glass-button px-1 py-1" type="button">EDIT</button>
                <button id="delete-entry" class="glass-button glass-button-danger px-1 py-1" type="button">DELETE</button>
            </footer>
        </article>

        <form id="edit-form" class="liquid-glass p-5 container d-flex flex-column align-items-center" hidden>
            <div class="container d-flex flex-column text-center">
                <label for="edit-title">Title</label>
                <input type="text" id="edit-title" name="edit-title" class="entry-input" required>
            </div>

            <div class="container d-flex flex-column text-center mb-4">
                <label for="edit-body">Reflection</label>
                <textarea id="edit-body" name="edit-body" rows="10" class="entry-input" required></textarea>
            </div>

            <button type="submit" class="glass-button mb-3" id="save-changes">SAVE CHANGES</button>
            <button type="button" id="cancel-edit" class="glass-button glass-button-danger">CANCEL</button>
        </form>
    </main>
</body>
</html>
